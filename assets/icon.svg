<!--
  Affiliateo favicon: a solid black rounded "app tile" with the white
  Affiliateo mark centered inside it, with padding so the mark never
  touches the edges. A solid colored tile keeps the icon crisp and visible
  on ANY browser tab color (light or dark) without relying on
  prefers-color-scheme tricks that Chrome/Safari ignore for favicons. Black
  (like Vercel's tab mark) reads clean and high-contrast against the white
  logo.
  Same 6 paths as logo.svg. The raw artwork has whitespace baked into
  its canvas (the mark only fills ~80% wide / ~69% tall of the 1254 box
  and sits slightly high), so the group recenters its true bounding-box
  center (625.5, 602.5) onto the tile center at native scale (1.0), making
  the white mark fill ~80% of the tile width. That extra margin keeps the
  mark's wide bottom legs clear of the rounded corners at tiny tab sizes.
  Filled white on the tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-label="Affiliateo">
  <rect width="1254" height="1254" rx="240" fill="#000000"/>
